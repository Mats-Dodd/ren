name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install locked devenv CLI
        run: bash tools/bootstrap-devenv.sh
      - name: Toolchain versions
        run: ./.devenv-cli/bin/devenv --no-tui shell --clean -- ren-toolchain
      - name: Compiler, native backends, and grammar checks
        run: ./.devenv-cli/bin/devenv --no-tui shell --clean -- ren-check
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
